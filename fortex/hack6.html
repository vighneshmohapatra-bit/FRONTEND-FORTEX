<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Slot - Zootopia</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* =========================
           GLOBAL STYLES (User Styling)
        ========================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg,
                    #0B1026,
                    #141B3A,
                    #2A1E4F,
                    #4B1D3F);
            color: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Decoration */
        .shape {
            position: absolute;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.4;
            border-radius: 50%;
        }

        .shape-1 {
            background: #4CC9F0;
            width: 500px;
            height: 500px;
            top: -150px;
            right: -100px;
            animation: float 12s infinite;
        }

        .shape-2 {
            background: #7209B7;
            width: 300px;
            height: 300px;
            bottom: -50px;
            left: -50px;
            animation: float 15s infinite reverse;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(25px, 25px);
            }
        }

        /* =========================
           SLOT CONTAINER
        ========================= */
        .container1 {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        h2 {
            text-align: center;
            margin-bottom: 2rem;
            background: linear-gradient(90deg, #F48FB1, #B06CFF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        label {
            display: block;
            margin-bottom: 0.8rem;
            color: #B8C1EC;
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* =========================
           DATE & TIME STYLING
        ========================= */
        input[type="date"] {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid rgba(76, 201, 240, 0.3);
            border-radius: 12px;
            background: rgba(20, 27, 58, 0.6);
            color: white;
            font-family: inherit;
            margin-bottom: 2rem;
            outline: none;
            cursor: pointer;
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        /* Time Slot Grid */
        .slot-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .slot-option {
            background: rgba(20, 27, 58, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.9rem;
        }

        /* Radio Input Trick (Hidden) */
        input[type="radio"] {
            display: none;
        }

        input[type="radio"]:checked+.slot-option {
            background: rgba(76, 201, 240, 0.2);
            border-color: #4CC9F0;
            color: #4CC9F0;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(76, 201, 240, 0.2);
        }

        .slot-option:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        /* =========================
           BUTTONS
        ========================= */
        button {
            background: linear-gradient(90deg, #F48FB1, #B06CFF);
            color: white;
            padding: 14px;
            border-radius: 999px;
            border: none;
            width: 100%;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(176, 108, 255, 0.35);
        }
    </style>
</head>

<body>

    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>

    <form onsubmit="return confirmSlot(event)">
        <div class="container1">
            <h2>Select Date & Time</h2>

            <label>CHOOSE DATE:</label>
            <input type="date" id="datePicker" required>

            <label>AVAILABLE SLOTS:</label>
            <div class="slot-grid">
                <label>
                    <input type="radio" name="slot" value="3:00 - 4:00 PM" required>
                    <div class="slot-option">3:00 - 4:00 PM</div>
                </label>
                <label>
                    <input type="radio" name="slot" value="4:00 - 5:00 PM">
                    <div class="slot-option">4:00 - 5:00 PM</div>
                </label>
                <label>
                    <input type="radio" name="slot" value="5:00 - 6:00 PM">
                    <div class="slot-option">5:00 - 6:00 PM</div>
                </label>
                <label>
                    <input type="radio" name="slot" value="6:00 - 7:00 PM">
                    <div class="slot-option">6:00 - 7:00 PM</div>
                </label>
                <label>
                    <input type="radio" name="slot" value="7:00 - 8:00 PM">
                    <div class="slot-option">7:00 - 8:00 PM</div>
                </label>
                <label>
                    <input type="radio" name="slot" value="8:00 - 9:00 PM">
                    <div class="slot-option">8:00 - 9:00 PM</div>
                </label>
            </div>

            <button type="submit">Confirm Schedule</button>
            <div style="text-align: center; margin-top: 1rem;">
                <a href="hack5.html"
                    style="color: rgba(255,255,255,0.6); text-decoration: none; font-size: 0.9rem;">Back</a>
            </div>
        </div>
    </form>

    <!-- Custom Confirmation Modal -->
    <div id="confirmModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-icon">✅</div>
            <h3>Appointment Confirmed!</h3>
            <p id="modalText"></p>
            <p style="color: #4CC9F0; font-size: 0.9rem; margin-top: 1rem;">📧 A detailed schedule has been emailed to
                you.</p>
            <button onclick="finishBooking()" class="modal-btn">Return to Home</button>
        </div>
    </div>

    <style>
        /* Reuse Modal Styles for Consistency */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: rgba(20, 27, 58, 0.9);
            border: 1px solid rgba(76, 201, 240, 0.3);
            border-radius: 20px;
            padding: 2.5rem;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 0 30px rgba(76, 201, 240, 0.2);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .modal-btn {
            margin-top: 1.5rem;
            background: linear-gradient(90deg, #F48FB1, #B06CFF);
            padding: 12px 24px;
            border-radius: 99px;
            border: none;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .modal-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(176, 108, 255, 0.4);
        }
    </style>

    <script>
        function confirmSlot(e) {
            e.preventDefault();

            const date = document.getElementById('datePicker').value;
            const slot = document.querySelector('input[name="slot"]:checked').value;

            // Show Modal
            const modal = document.getElementById('confirmModal');
            const modalText = document.getElementById('modalText');

            modalText.innerHTML = `Date: <strong>${date}</strong><br>Time Slot: <strong>${slot}</strong>`;
            modal.style.display = 'flex';

            // Simulate Email Sending
            console.log(`[System] Sending final confirmation email for ${date} at ${slot}...`);
            console.log("[System] Email sent successfully ✅");
        }

        function finishBooking() {
            window.location.href = 'index.html';
        }
    </script>
</body>

</html>
