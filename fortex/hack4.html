<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Services - Zootopia</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* =========================
           GLOBAL STYLES (User Provided + Enhancements)
        ========================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg,
                    #0B1026,
                    #141B3A,
                    #2A1E4F,
                    #4B1D3F);
            color: #FFFFFF;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        /* =========================
           TYPOGRAPHY
        ========================= */
        h1,
        h2,
        h3 {
            font-weight: 600;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 3rem;
            text-align: center;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        p {
            color: #B8C1EC;
            line-height: 1.6;
        }

        /* Gradient text */
        .gradient-text {
            background: linear-gradient(90deg, #F48FB1, #B06CFF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* =========================
           SERVICE CARDS LAYOUT
        ========================= */
        .services-container {
            display: flex;
            justify-content: center;
            gap: 4rem;
            flex-wrap: wrap;
            width: 100%;
            max-width: 1200px;
        }

        .service-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 2rem;
            width: 350px;
            text-align: center;
            transition: all 0.4s ease;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .service-card:hover {
            transform: translateY(-15px) scale(1.02);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(176, 108, 255, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(176, 108, 255, 0.2);
        }

        .card-image {
            width: 100%;
            height: 250px;
            border-radius: 20px;
            object-fit: cover;
            margin-bottom: 2rem;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            transition: transform 0.4s ease;
        }

        .service-card:hover .card-image {
            transform: scale(1.05);
        }

        .card-title {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: white;
            transition: color 0.3s ease;
        }

        .service-card:hover .card-title {
            background: linear-gradient(90deg, #F48FB1, #B06CFF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card-desc {
            font-size: 1rem;
            color: #B8C1EC;
            margin-bottom: 2rem;
        }

        /* =========================
           BUTTONS
        ========================= */
        .btn-primary {
            background: linear-gradient(90deg, #F48FB1, #B06CFF);
            color: #FFFFFF;
            padding: 12px 28px;
            border-radius: 999px;
            border: none;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: inline-block;
            width: 80%;
            text-decoration: none;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(176, 108, 255, 0.35);
        }

        /* Background Shapes */
        .shape {
            position: absolute;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.4;
            border-radius: 50%;
        }

        .shape-1 {
            background: #B06CFF;
            width: 400px;
            height: 400px;
            top: -100px;
            left: -100px;
            animation: float 10s infinite;
        }

        .shape-2 {
            background: #F48FB1;
            width: 300px;
            height: 300px;
            bottom: -50px;
            right: -50px;
            animation: float 14s infinite reverse;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(30px, 30px);
            }

            100% {
                transform: translate(0, 0);
            }
        }
    </style>
</head>

<body>

    <!-- Background Decoration -->
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>

    <h1 class="gradient-text">Choose Your Service</h1>

    <div class="services-container">
        <!-- Service 1: Pet Care -->
        <a href="hack5.html" class="service-card">
            <img src="D://vighnesh/hack14.png" alt="Pet Care" class="card-image"
                onerror="this.src='https://via.placeholder.com/400x300/4B1D3F/FFFFFF?text=Pet+Care'">
            <h3 class="card-title">PET CARE</h3>
            <p class="card-desc">Professional care for your beloved pets with trusted routines and monitoring.</p>
            <div class="btn-primary">Select Service</div>
        </a>

        <!-- Service 2: Pup and Chill -->
        <a href="hack6.html" class="service-card">
            <img src="D://vighnesh/hack2.png" alt="Pup and Chill" class="card-image"
                onerror="this.src='https://via.placeholder.com/400x300/2A1E4F/FFFFFF?text=Pup+and+Chill'">
            <h3 class="card-title">PUP AND CHILL</h3>
            <p class="card-desc">Relaxed boarding environment perfect for socialization and playtime.</p>
            <div class="btn-primary">Select Service</div>
        </a>
    </div>

    <!-- Instructions Text (if any needed, keeping clean for now) -->

</body>

</html>
