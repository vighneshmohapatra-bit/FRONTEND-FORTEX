<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Gallery - Zootopia</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* =========================
           GLOBAL STYLES (User Provided)
        ========================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0B1026, #141B3A, #2A1E4F, #4B1D3F);
            color: #FFFFFF;
            padding: 2rem;
            overflow-x: hidden;
        }

        h1,
        h2,
        h3 {
            font-weight: 600;
        }

        p {
            color: #B8C1EC;
            line-height: 1.6;
        }

        .gradient-text {
            background: linear-gradient(90deg, #F48FB1, #B06CFF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Gallery Grid */
        .gallery-container {
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }

        .gallery-header {
            margin-bottom: 3rem;
            font-size: 3rem;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .media-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.3s;
            position: relative;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .media-card:hover {
            transform: translateY(-10px);
            border-color: #F48FB1;
            box-shadow: 0 15px 40px rgba(176, 108, 255, 0.3);
        }

        .media-card img,
        .media-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            min-height: 250px;
        }

        /* Back Button */
        .back-btn {
            display: inline-block;
            margin-top: 3rem;
            color: #4CC9F0;
            text-decoration: none;
            border: 1px solid #4CC9F0;
            padding: 10px 25px;
            border-radius: 50px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #4CC9F0;
            color: #0B1026;
        }
    </style>
</head>

<body>
    <div class="gallery-container">
        <h1 class="gradient-text gallery-header">Our Happy Pets</h1>

        <div class="media-grid">
            <div class="media-card"><img src="images/pet1.png" alt="Happy Pet"
                    onerror="this.src='https://via.placeholder.com/400x300/2A1E4F/FFFFFF?text=Pet+Moment+1'"></div>
            <div class="media-card"><img src="images/pet2.png" alt="Happy Pet"
                    onerror="this.src='https://via.placeholder.com/400x300/2A1E4F/FFFFFF?text=Pet+Moment+2'"></div>
            <div class="media-card"><img src="images/pet3.png" alt="Happy Pet"
                    onerror="this.src='https://via.placeholder.com/400x300/2A1E4F/FFFFFF?text=Pet+Moment+3'"></div>


        </div>

        <a href="index.html" class="back-btn">← Back to Home</a>
    </div>
</body>

</html>
